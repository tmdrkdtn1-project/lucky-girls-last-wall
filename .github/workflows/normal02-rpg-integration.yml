name: NORMAL_02 RPG Integration Checks
on:
  push:
    branches:
      - integration/normal02-rpg-20261010
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/assets/**'
      - 'tests/**'
      - '.github/workflows/normal02-rpg-integration.yml'
permissions:
  contents: read
jobs:
  integration-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app/src/main/assets/js/game.js
      - name: Stage 1 regression
        run: python3 tests/check_stage1.py
      - name: Frozen Stage 2 TD
        run: python3 tests/balance_lab/test_stage2_td_foundation_v1.py
      - name: NORMAL_02 player-lock preflight
        run: python3 tests/balance_lab/test_normal02_integration_preflight_v1.py
      - name: Stage 2 RPG source guard
        run: python3 tests/check_stage2_rpg_source_v1.py
      - name: Stage 2 release plumbing guard
        run: python3 tests/check_stage2_release.py
      - name: Stage 2 RPG browser 4-seed component
        run: python3 tests/balance_lab/normal02_rpg_browser_ci_v1.py
      - name: Stage 2 TD to RPG browser 4-seed integration
        run: python3 tests/balance_lab/normal02_td_rpg_browser_ci_v1.py
      - name: Stage 2 release first and repeat clear browser reward
        run: python3 tests/balance_lab/normal02_release_browser_ci_v1.py
      - name: Stage 2 RPG defeat retry no reward
        run: python3 tests/balance_lab/normal02_defeat_retry_browser_ci_v1.py
      - name: Verify Golden runner blocks missing P0
        run: python3 tests/balance_lab/golden_runner_v1.py --self-test --contract tests/balance_lab/golden_normal02_rpg_v1.json
      - name: Evaluate five live NORMAL_02 Golden P0 scenarios
        run: python3 tests/balance_lab/normal02_golden_live_ci_v1.py
      - name: Preserve run-scoped NORMAL_02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal02-rpg-ci-evidence
          path: |
            tests/balance_lab/normal02_rpg_a_component_result.json
            tests/balance_lab/normal02_td_rpg_integration_result.json
            tests/balance_lab/normal02_release_idempotency_result.json
            tests/balance_lab/normal02_defeat_retry_ci_result.json
            tests/balance_lab/normal02_golden_live_ci_result.json
          retention-days: 7
          if-no-files-found: warn
