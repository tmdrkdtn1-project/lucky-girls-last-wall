name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read versionCode
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Check battle modal lifecycle
        run: python3 scripts/check_modal_lifecycle.py
      - name: Check battle prep start flow
        run: python3 scripts/check_prep_start_flow.py
      - name: Check rapid battle input path
        run: python3 scripts/check_fast_input.py
      - name: Check fixed battle viewport
        run: python3 scripts/check_battle_viewport.py
      - name: Check battle DOM stability
        run: python3 scripts/check_battle_dom_stability.py
      - name: Check exclusive battle actions
        run: python3 scripts/check_exclusive_battle_actions.py
      - name: Check LUCK system
        run: python3 scripts/check_luck_system.py
      - name: Check battle stress guards
        run: python3 scripts/check_battle_stress_guards.py
      - name: Check battle session guards
        run: python3 scripts/check_battle_session_guards.py
      - name: Check pause/speed loop lifecycle
        run: python3 scripts/check_pause_speed_loop.py
      - name: Check result transitions
        run: python3 scripts/check_result_transitions.py
      - name: Check app lifecycle recovery
        run: python3 scripts/check_app_lifecycle.py
      - name: Check stability closeout
        run: python3 scripts/check_stability_closeout.py
      - name: Automated battle play stress matrix
        run: python3 scripts/check_auto_play_stress.py
      - name: Check executable battle core boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'function runBattleStep()' in h
          loop=h[h.index('function startLoop()'):h.index("$('enter').onclick")]
          assert 'runBattleStep()' in loop
          assert 'waveTime+=1.1*speed' not in loop
          assert 'animateCombatVolley()' not in loop
          print('PASS - scheduler delegates one battle simulation step')
          PY
      - name: Check runtime battle flow surface
        run: python3 scripts/check_runtime_battle_flow.py
      - name: Check runtime test surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          for token in ['window.__LG_TEST__','snapshot:()=>','start:()=>','summon:()=>','speed:()=>','step:()=>runBattleStep()','swap:(a,b)=>swapFormation(a,b)']:
              assert token in h, token
          print('PASS - deterministic runtime test API available')
          PY
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute battle flow in Chromium
        shell: bash
        run: |
          python3 -m http.server 8765 --directory app/src/main/assets >/tmp/lg-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node scripts/runtime_battle_flow.mjs
      - name: Show runtime checkpoint on failure
        if: failure()
        shell: bash
        run: |
          echo "Last Chromium runtime checkpoint:"
          cat /tmp/lg-runtime-state.json 2>/dev/null || cat /tmp/lg-runtime-marker.txt 2>/dev/null || echo "No checkpoint recorded"
          {
            echo "## Chromium runtime failure"
            echo
            echo '~~~json'
            cat /tmp/lg-runtime-state.json 2>/dev/null || echo '{"error":"No checkpoint recorded"}'
            echo
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/lg-runtime-state.json ]; then
            STATE="$(cat /tmp/lg-runtime-state.json)"
            printf '::error title=LG_RUNTIME_DIAGNOSTIC::%s\n' "$STATE"
          fi

      - name: Publish runtime diagnostic check
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/lg-runtime-state.json ]; then
            STATE="$(cat /tmp/lg-runtime-state.json)"
          else
            STATE='{"error":"missing runtime state"}'
          fi
          echo "RUNTIME_DIAGNOSTIC_JSON=$STATE"
          printf 'Automated Chromium runtime failure diagnostic.\n\nRun: %s\nCommit: %s\n\n~~~json\n%s\n~~~\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$STATE" > /tmp/lg-runtime-issue.md
          gh issue create --title "Runtime diagnostic run ${GITHUB_RUN_NUMBER}" --body-file /tmp/lg-runtime-issue.md

      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-failure-diagnostics
          path: /tmp/lg-runtime-state.json
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: luckygirls-debug-${{ steps.version.outputs.code }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
