<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}body{margin:0;background:#090817;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}.screen{display:none;height:100vh;overflow:auto;padding:18px;background:radial-gradient(circle at 50% 15%,#39214f,#090817 55%)}.screen.on{display:block}.top{display:flex;justify-content:space-between}.title{font-size:28px;margin:12px 0 0;color:#ff76df}.muted{color:#9aa0bd}.card{margin-top:18px;padding:18px;border:1px solid #6e4a8d;border-radius:20px;background:#151329dd}.hero{height:30vh;display:flex;align-items:center;justify-content:center;font-size:78px}.btn{width:100%;padding:17px;margin-top:12px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:white;background:linear-gradient(90deg,#ff3fc8,#7657ff)}.secondary{background:#25223b}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#33204b;color:#f4b5ff;margin-top:10px}.foot{text-align:center;color:#777b98;margin-top:18px;font-size:12px}.hud{display:flex;justify-content:space-between;align-items:center}.hudbtn{border:0;border-radius:10px;background:#29233d;color:#fff;padding:8px 10px;font-weight:800}.speedon{background:#704baf}.waveprog{height:5px;background:#252037;border-radius:8px;overflow:hidden;margin-top:8px}.waveprog i{display:block;height:100%;background:linear-gradient(90deg,#ff4ecb,#735cff)}.battle{height:44vh;margin-top:12px;border:1px solid #6e4a8d;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#17142a,#0c0b16)}.path{position:absolute;left:8%;right:8%;top:47%;height:42px;border:2px dashed #75558d;border-radius:30px}.enemy{position:absolute;top:45%;font-size:34px;animation:walk 7s linear infinite;filter:drop-shadow(0 0 7px #b04cff)}.shot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ff7de3;box-shadow:0 0 12px #ff7de3;animation:shot .45s linear forwards}.skillfx{position:absolute;left:58%;top:37%;font-weight:900;font-size:18px;animation:pop .7s ease-out forwards;z-index:8}.bossbar{position:absolute;left:18%;right:18%;top:12px;height:9px;border-radius:8px;background:#2a2235;overflow:hidden}.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#ff386d,#ff9d3f)}@keyframes pop{from{transform:scale(.6);opacity:1}to{transform:translateY(-32px) scale(1.25);opacity:0}}@keyframes shot{from{left:18%;top:68%}to{left:72%;top:49%}}@keyframes walk{from{left:-12%}to{left:100%}}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.slot{aspect-ratio:1;border:1px solid #514466;border-radius:12px;background:#171528;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;overflow:hidden}.chibi{width:44px;height:55px;position:relative;animation:bob 1.4s ease-in-out infinite}.head{width:27px;height:27px;border-radius:50%;background:#ffd7c8;position:absolute;left:9px;top:4px;border:2px solid #fff8}.hair{width:31px;height:18px;border-radius:18px 18px 8px 8px;position:absolute;left:7px;top:1px}.body{width:25px;height:26px;border-radius:10px 10px 7px 7px;position:absolute;left:10px;top:28px}.weapon{position:absolute;right:0;top:23px;font-size:17px}.star{position:absolute;bottom:1px;left:3px;font-size:10px;color:#ffd65a}@keyframes bob{50%{transform:translateY(-3px)}}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.actions .btn{font-size:14px;padding:14px 4px}.list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.unit{padding:14px;border-radius:15px;background:#1b1830;border:1px solid #4d4167}.result{position:fixed;inset:0;background:#080713ed;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}.resultbox{width:100%;max-width:430px;padding:24px;border:1px solid #76559a;border-radius:24px;background:#171329;text-align:center}.resultbox h1{font-size:34px;margin:4px}.reward{font-size:22px;color:#ffd86b;margin:15px}.rarity{font-size:11px;padding:4px 8px;border-radius:20px;background:#342846;color:#e7c6ff;display:inline-block;margin-top:6px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.nav .btn{font-size:13px;padding:12px 4px}.shopcard{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;padding:12px;margin:9px 0;border:1px solid #493d63;border-radius:15px;background:#17142a}.portrait{width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,#5b3975,#27213b);display:flex;align-items:center;justify-content:center;font-size:27px}.buy{border:0;border-radius:11px;padding:10px;background:#724d9d;color:#fff;font-weight:800}.owned{background:#263b32;color:#8effb8}.back{width:auto;padding:10px 14px;margin:0 0 12px}.summonflash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090817dd;z-index:30;font-size:72px;animation:reveal .65s ease forwards}.info{position:fixed;left:7%;right:7%;bottom:5%;padding:18px;border-radius:20px;background:#17142af2;border:1px solid #8a62ad;z-index:20}.info h3{margin:0 0 5px}.close{float:right;border:0;border-radius:10px;padding:7px 10px;background:#3a3150;color:#fff}@keyframes reveal{0%{opacity:0;transform:scale(.7)}45%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1)}}
</style></head><body>
<section id="home" class="screen on"><div class="top"><div><span class="muted">PROTOTYPE 1.2.0</span><div class="title">LUCKY GIRLS</div><b>LAST WALL</b></div><div>💎 1,200<br>🪙 <span id="wallet">8,500</span></div></div><div class="card"><span class="tag">🌙 폐허가 된 성채</span><div class="hero">⚔️</div><b>아리아 · 성기사</b><br><span class="muted">무작위 소환 · 3체 합성 · LUCK JACKPOT</span></div><button id="start" class="btn">전투 시작</button><div class="nav"><button id="collection" class="btn secondary">컬렉션 · 20</button><button id="shop" class="btn secondary">상점</button><button id="daily" class="btn secondary">출석 보상</button></div><div class="foot">Playable Android prototype · NIGHTFALL</div></section>
<section id="battle" class="screen"><div class="hud"><button id="back" class="btn secondary back">← 로비</button><b>WAVE <span id="wave">1</span>/20</b><span>❤️ <span id="life">20</span>　🪙 <span id="gold">120</span></span></div><div class="hud"><span class="muted" id="killtxt">0 KILL</span><span><button id="pause" class="hudbtn">Ⅱ</button> <button id="speed" class="hudbtn">×1</button></span></div><div class="waveprog"><i id="waveprog" style="width:5%"></i></div><div class="battle" id="field"><div class="path"></div><div id="enemy" class="enemy">👾</div><div id="bossbar" class="bossbar" style="display:none"><i id="bosshp" style="width:100%"></i></div><div id="boss" style="display:none;position:absolute;top:35%;left:72%;font-size:52px">👹</div></div><div id="grid" class="grid"></div><div class="actions"><button id="summon" class="btn">소환 30G</button><button id="merge" class="btn secondary">3체 합성</button><button id="luck" class="btn secondary">LUCK 0%</button></div><div class="foot" id="msg">전투 시작! 유닛을 소환하세요.</div></section>
<section id="col" class="screen"><button id="colback" class="btn secondary back">← 로비</button><h2>컬렉션 · 20</h2><div id="list" class="list"></div></section><section id="store" class="screen"><button id="shopback" class="btn secondary back">← 로비</button><h2>가디언 상점</h2><p class="muted">원하는 캐릭터를 직접 해금합니다.</p><div id="shoplist"></div></section>
<script>
const chars=['아리아 ⚔️','유나 🎴','리엘 🔮','루비 🔫','에리카 🐉','세라 😇','레이나 ❄️','카린 🥷','벨 🧸','미아 🗡️','아이린 🫖','네온 💻','샤샤 💣','루나 ✨','비올라 🧪','클로에 🎤','아델 🛡️','니아 😈','오로라 🌠','이브 ⏳'];
let gold=120,life=20,wave=1,luck=0,units=[],kills=0,running=false,timer=null,bossHp=100,bossTick=0,jackpotUntil=0,speed=1,paused=false;let meta=JSON.parse(localStorage.getItem('lg_meta')||'{"coins":8500,"gems":1200,"owned":[0,1,2,3,4],"daily":0}');const looks={아리아:['#ff8acb','#d94a91','⚔️'],유나:['#f7f2ff','#a77cff','🎴'],리엘:['#d8c2ff','#6d4bdb','🔮'],루비:['#ffb06a','#d95050','🔫'],에리카:['#78e4ff','#246e9c','🐉']};
const save=()=>localStorage.setItem('lg_meta',JSON.stringify(meta));const role={아리아:'성기사 · 광역 참격',유나:'무녀 · 속박/제어',리엘:'마도사 · 원소 폭발',루비:'총잡이 · 연사/도탄',에리카:'용혈 · 확률 각성'};const $=id=>document.getElementById(id);
function result(win){running=false;if(timer)clearInterval(timer);let reward=win?350:Math.max(40,wave*12),x=document.createElement('div');x.className='result';x.innerHTML='<div class="resultbox"><div class="muted">BATTLE RESULT</div><h1>'+(win?'VICTORY':'DEFEAT')+'</h1><p>도달 WAVE '+Math.min(20,wave)+' · '+kills+' KILL</p><div class="reward">🪙 +'+reward+'</div><button class="btn" id="again">다시 도전</button><button class="btn secondary" id="resultHome">로비</button></div>';document.body.appendChild(x);x.querySelector('#again').onclick=()=>{x.remove();$('start').click()};x.querySelector('#resultHome').onclick=()=>{x.remove();show('home')}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
function metaRender(){$('wallet').textContent=meta.coins.toLocaleString();renderShop()}function render(){ $('gold').textContent=gold;$('life').textContent=life;$('wave').textContent=wave;$('killtxt').textContent=kills+' KILL';$('waveprog').style.width=Math.min(100,wave*5)+'%';$('luck').textContent='LUCK '+luck+'%';$('grid').innerHTML='';for(let i=0;i<16;i++){let d=document.createElement('div');d.className='slot';if(units[i]){let u=units[i],v=looks[u.name]||['#ddd','#777',u.icon];d.innerHTML='<div class="chibi"><div class="hair" style="background:'+v[0]+'"></div><div class="head"></div><div class="body" style="background:'+v[1]+'"></div><div class="weapon">'+v[2]+'</div><div class="star">'+('★'.repeat(Math.min(5,u.lv)))+'</div></div>';}else d.innerHTML='';d.dataset.idx=i;d.onclick=()=>{if(units[i])unitInfo(i)};$('grid').appendChild(d)}}
function unitInfo(i){let u=units[i],old=$('unitinfo');if(old)old.remove();let x=document.createElement('div');x.id='unitinfo';x.className='info';x.innerHTML='<button class="close">닫기</button><h3>'+u.icon+' '+u.name+' · '+u.lv+'성</h3><div class="muted">'+(role[u.name]||'가디언')+'</div><p>현재 전투력 '+u.lv+' · 동일 캐릭터/등급 3체 합성 가능</p>';document.body.appendChild(x);x.querySelector('.close').onclick=()=>x.remove()}
function summonFx(u){let x=document.createElement('div');x.className='summonflash';x.textContent=u.icon;document.body.appendChild(x);setTimeout(()=>x.remove(),650)}
function fx(txt){let f=$('field');let x=document.createElement('i');x.className='shot';f.appendChild(x);setTimeout(()=>x.remove(),500);if(txt){let q=document.createElement('b');q.className='skillfx';q.textContent=txt;f.appendChild(q);setTimeout(()=>q.remove(),750)}}
function skillPower(){let p=0,n=[];units.forEach(u=>{let m=1;if(u.name==='아리아')m=1.25;if(u.name==='리엘'&&Math.random()<.28){m=2.2;n.push('🔥 폭발')}if(u.name==='루비')m=1.18;if(u.name==='에리카'&&Math.random()<.08){m=4;n.push('🐉 각성')}if(u.name==='유나'&&Math.random()<.2)n.push('🧿 속박');p+=u.lv*m});if(Date.now()<jackpotUntil)p*=2;return [p,n[0]]}
function bossSkill(){if(wave%5!==0)return;let name={5:'🪨 지진!',10:'🐙 골드 강탈!',15:'👑 재생!',20:'🐲 서리 숨결!'}[wave];if(wave===5)life=Math.max(0,life-1);if(wave===10)gold=Math.max(0,gold-15);if(wave===15)bossHp=Math.min(100,bossHp+12);if(wave===20)luck=Math.max(0,luck-12);fx(name);$('msg').textContent='BOSS SKILL · '+name}
function enemySkin(){let e=$('enemy'),b=$('boss');if(wave%5===0){e.textContent='';b.textContent={5:'🗿',10:'🐙',15:'👑',20:'🐲'}[wave]||'👹';bossHp=100;$('bosshp').style.width='100%';$('bossbar').style.display='block';return}b.style.display='none';$('bossbar').style.display='none';let a=['👾','👻','🛡️'];e.textContent=a[(wave-1)%3]}
function startLoop(){if(timer)clearInterval(timer);running=true;timer=setInterval(()=>{if(!running||paused)return;let sp=skillPower(),power=sp[0],need=3+Math.floor(wave*0.7);bossTick++;if(wave%5===0&&bossTick%2===0)bossSkill();if(power>=need){fx(sp[1]);if(wave%5===0){bossHp=Math.max(0,bossHp-Math.max(6,power*1.8));$('bosshp').style.width=bossHp+'%';if(bossHp>0){$('msg').textContent='⚔️ 보스 공격 · HP '+Math.ceil(bossHp)+'%';render();return}}kills++;gold+=5+wave;luck=Math.min(100,luck+3);$('msg').textContent='⚔️ 적 처치!  '+kills+' KILL';if(kills%6===0){wave++;if(wave>20){running=false;clearInterval(timer);$('msg').textContent='🏆 20 WAVE 클리어!';setTimeout(()=>result(true),500);return}let boss=wave%5===0;bossTick=0;enemySkin();$('msg').textContent=boss?'👹 BOSS WAVE '+wave:'🌙 WAVE '+wave+' 진입';}}else{life--; $('msg').textContent='💥 방어선 피해! 전투력 '+power+'/'+need;if(life<=0){life=0;running=false;clearInterval(timer);$('msg').textContent='☠️ 방어선 붕괴';setTimeout(()=>result(false),500)}}render()},2200/speed)}
$('start').addEventListener('click',()=>{gold=120;life=20;wave=1;luck=0;kills=0;units=[];bossHp=100;bossTick=0;jackpotUntil=0;speed=1;paused=false;$('speed').textContent='×1';$('speed').classList.remove('speedon');$('pause').textContent='Ⅱ';show('battle');enemySkin();render();startLoop()});$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('msg').textContent=paused?'⏸ 일시정지':'▶ 전투 재개'};$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent='×'+speed;$('speed').classList.toggle('speedon',speed===2);if(running)startLoop();};$('back').onclick=()=>{running=false;if(timer)clearInterval(timer);$('boss').style.display='none';$('bossbar').style.display='none';show('home')};$('collection').onclick=()=>{renderCollection();show('col')};$('colback').onclick=()=>show('home');$('shop').onclick=()=>{renderShop();show('store')};$('shopback').onclick=()=>show('home');$('daily').onclick=()=>{let d=new Date().toDateString();if(meta.daily===d){alert('오늘 보상은 이미 받았습니다.');return}meta.daily=d;meta.coins+=500;save();metaRender();alert('출석 보상 +500 코인!')};
$('summon').onclick=()=>{if(gold<30){$('msg').textContent='골드가 부족합니다.';return}if(units.length>=16){$('msg').textContent='보드가 가득 찼습니다.';return}gold-=30;let pool=meta.owned.filter(i=>i<5);if(!pool.length)pool=[0];let c=chars[pool[Math.floor(Math.random()*pool.length)]],p=c.split(' ');let nu={name:p[0],icon:p[1],lv:1};units.push(nu);summonFx(nu);luck=Math.min(100,luck+8);$('msg').textContent=p[0]+' 소환!';render()};
$('merge').onclick=()=>{let found=false;for(let i=0;i<units.length&&!found;i++){let ids=[];for(let j=0;j<units.length;j++)if(units[j].name===units[i].name&&units[j].lv===units[i].lv)ids.push(j);if(ids.length>=3){let base=units[ids[0]],great=Math.random()<.09;base.lv+=great?2:1;units=units.filter((_,k)=>k!==ids[1]&&k!==ids[2]);gold+=10;luck=Math.min(100,luck+15);$('msg').textContent=great?'🌟 GREAT SUCCESS! '+base.name+' '+base.lv+'성':'✨ '+base.name+' '+base.lv+'성 합성 성공!';found=true}}if(!found)$('msg').textContent='같은 유닛 3체가 필요합니다.';render()};
$('luck').onclick=()=>{if(luck<100){$('msg').textContent='LUCK 게이지를 100% 채워주세요.';return}luck=0;let r=Math.random();if(r<.1){gold+=300;jackpotUntil=Date.now()+10000;$('msg').textContent='🎰 JACKPOT! +300G · 10초 공격력 ×2'}else if(r<.4){gold+=100;$('msg').textContent='✨ LEGEND! +100G'}else if(r<.8){gold+=50;$('msg').textContent='🪙 GOLD! +50G'}else $('msg').textContent='💨 MISS...';render()};
function renderCollection(){$('list').innerHTML=chars.map((c,i)=>{let n=c.split(' ')[0],rar=i<5?'STARTER':i<12?'RARE':'EPIC',own=meta.owned.includes(i);return '<div class="unit"><b>'+(i+1)+'. '+c+'</b><br><span class="rarity">'+rar+'</span><br><span class="muted">'+(own?(role[n]||'해금 완료'):'🔒 미해금')+'</span></div>'}).join('')}
function renderShop(){if(!$('shoplist'))return;$('shoplist').innerHTML=chars.slice(5).map((c,j)=>{let i=j+5,own=meta.owned.includes(i),price=i<12?3000:4500;return '<div class="shopcard"><div class="portrait">'+c.split(' ')[1]+'</div><div><b>'+c+'</b><br><span class="muted">'+(i<12?'RARE':'EPIC')+'</span></div><button class="buy '+(own?'owned':'')+'" data-i="'+i+'" data-p="'+price+'">'+(own?'보유중':'🪙 '+price.toLocaleString())+'</button></div>'}).join('');document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,p=+b.dataset.p;if(meta.owned.includes(i))return;if(meta.coins<p){alert('코인이 부족합니다.');return}meta.coins-=p;meta.owned.push(i);save();metaRender();renderCollection()})}
renderCollection();metaRender();render();
</script></body></html>
