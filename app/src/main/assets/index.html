<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}body{margin:0;background:#090817;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}.screen{display:none;height:100vh;overflow:auto;padding:18px;background:radial-gradient(circle at 50% 15%,#39214f,#090817 55%)}.screen.on{display:block}.top{display:flex;justify-content:space-between}.title{font-size:28px;margin:12px 0 0;color:#ff76df}.muted{color:#9aa0bd}.card{margin-top:18px;padding:18px;border:1px solid #6e4a8d;border-radius:20px;background:#151329dd}.hero{height:30vh;display:flex;align-items:center;justify-content:center;font-size:78px}.btn{width:100%;padding:17px;margin-top:12px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:white;background:linear-gradient(90deg,#ff3fc8,#7657ff)}.secondary{background:#25223b}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#33204b;color:#f4b5ff;margin-top:10px}.foot{text-align:center;color:#777b98;margin-top:18px;font-size:12px}.hud{display:flex;justify-content:space-between;align-items:center}.battle{height:44vh;margin-top:12px;border:1px solid #6e4a8d;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#17142a,#0c0b16)}.path{position:absolute;left:8%;right:8%;top:47%;height:42px;border:2px dashed #75558d;border-radius:30px}.enemy{position:absolute;top:45%;font-size:34px;animation:walk 7s linear infinite}@keyframes walk{from{left:-12%}to{left:100%}}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.slot{aspect-ratio:1;border:1px solid #514466;border-radius:12px;background:#171528;display:flex;align-items:center;justify-content:center;font-size:29px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.actions .btn{font-size:14px;padding:14px 4px}.list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.unit{padding:14px;border-radius:15px;background:#1b1830;border:1px solid #4d4167}.back{width:auto;padding:10px 14px;margin:0 0 12px}
</style></head><body>
<section id="home" class="screen on"><div class="top"><div><span class="muted">PROTOTYPE 0.5.3</span><div class="title">LUCKY GIRLS</div><b>LAST WALL</b></div><div>💎 1,200<br>🪙 <span id="wallet">8,500</span></div></div><div class="card"><span class="tag">🌙 폐허가 된 성채</span><div class="hero">⚔️</div><b>아리아 · 성기사</b><br><span class="muted">무작위 소환 · 3체 합성 · LUCK JACKPOT</span></div><button id="start" class="btn">전투 시작</button><button id="collection" class="btn secondary">컬렉션 · 20</button><div class="foot">Playable Android prototype · NIGHTFALL</div></section>
<section id="battle" class="screen"><div class="hud"><button id="back" class="btn secondary back">← 로비</button><b>WAVE <span id="wave">1</span>/20</b><span>❤️ <span id="life">20</span>　🪙 <span id="gold">120</span></span></div><div class="battle"><div class="path"></div><div class="enemy">👾</div></div><div id="grid" class="grid"></div><div class="actions"><button id="summon" class="btn">소환 30G</button><button id="merge" class="btn secondary">3체 합성</button><button id="luck" class="btn secondary">LUCK 0%</button></div><div class="foot" id="msg">전투 시작! 유닛을 소환하세요.</div></section>
<section id="col" class="screen"><button id="colback" class="btn secondary back">← 로비</button><h2>컬렉션 · 20</h2><div id="list" class="list"></div></section>
<script>
const chars=['아리아 ⚔️','유나 🎴','리엘 🔮','루비 🔫','에리카 🐉','세라 😇','레이나 ❄️','카린 🥷','벨 🧸','미아 🗡️','아이린 🫖','네온 💻','샤샤 💣','루나 ✨','비올라 🧪','클로에 🎤','아델 🛡️','니아 😈','오로라 🌠','이브 ⏳'];
let gold=120,life=20,wave=1,luck=0,units=[];
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
function render(){ $('gold').textContent=gold;$('life').textContent=life;$('wave').textContent=wave;$('luck').textContent='LUCK '+luck+'%';$('grid').innerHTML='';for(let i=0;i<16;i++){let d=document.createElement('div');d.className='slot';d.textContent=units[i]?units[i].icon:'';$('grid').appendChild(d)}}
$('start').addEventListener('click',()=>{show('battle');render()});$('back').onclick=()=>show('home');$('collection').onclick=()=>show('col');$('colback').onclick=()=>show('home');
$('summon').onclick=()=>{if(gold<30){$('msg').textContent='골드가 부족합니다.';return}if(units.length>=16){$('msg').textContent='보드가 가득 찼습니다.';return}gold-=30;let c=chars[Math.floor(Math.random()*5)],p=c.split(' ');units.push({name:p[0],icon:p[1],lv:1});luck=Math.min(100,luck+8);$('msg').textContent=p[0]+' 소환!';render()};
$('merge').onclick=()=>{let found=false;for(let i=0;i<units.length&&!found;i++){let ids=[];for(let j=0;j<units.length;j++)if(units[j].name===units[i].name&&units[j].lv===units[i].lv)ids.push(j);if(ids.length>=3){let base=units[ids[0]];base.lv++;units=units.filter((_,k)=>k!==ids[1]&&k!==ids[2]);gold+=10;luck=Math.min(100,luck+15);$('msg').textContent='✨ '+base.name+' '+base.lv+'성 합성 성공!';found=true}}if(!found)$('msg').textContent='같은 유닛 3체가 필요합니다.';render()};
$('luck').onclick=()=>{if(luck<100){$('msg').textContent='LUCK 게이지를 100% 채워주세요.';return}luck=0;let r=Math.random();if(r<.1){gold+=300;$('msg').textContent='🎰 JACKPOT! +300G'}else if(r<.4){gold+=100;$('msg').textContent='✨ LEGEND! +100G'}else if(r<.8){gold+=50;$('msg').textContent='🪙 GOLD! +50G'}else $('msg').textContent='💨 MISS...';render()};
$('list').innerHTML=chars.map((c,i)=>'<div class="unit"><b>'+(i+1)+'. '+c+'</b><br><span class="muted">'+(i<5?'사용 가능':'잠금 · 개발 예정')+'</span></div>').join('');
render();
</script></body></html>
