d:#29233d;color:#fff;padding:8px 10px;font-weight:800}.speedon{background:#704baf}.waveprog{height:5px;background:#252037;border-radius:8px;overflow:hidden;margin-top:8px}.waveprog i{display:block;height:100%;background:linear-gradient(90deg,#ff4ecb,#735cff)}.battle{height:44vh;margin-top:12px;border:1px solid #6e4a8d;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#17142a,#0c0b16)}.path{position:absolute;left:8%;right:8%;top:47%;height:42px;border:2px dashed #75558d;border-radius:30px}.enemy{position:absolute;top:45%;font-size:34px;animation:walk 7s linear infinite;filter:drop-shadow(0 0 7px #b04cff)}.shot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ff7de3;box-shadow:0 0 12px #ff7de3;animation:shot .45s linear forwards}.skillfx{position:absolute;left:58%;top:37%;font-weight:900;font-size:18px;animation:pop .7s ease-out forwards;z-index:8}.vfx{position:absolute;z-index:7;pointer-events:none}.slash{left:55%;top:35%;width:80px;height:8px;background:#fff;box-shadow:0 0 16px #ff8ee5;transform:rotate(-28deg);animation:vanish .45s}.magic{left:63%;top:35%;width:54px;height:54px;border:4px solid #a988ff;border-radius:50%;box-shadow:0 0 22px #865fff;animation:spin .65s}.ice{left:64%;top:34%;width:48px;height:48px;border:4px solid #a9edff;transform:rotate(45deg);box-shadow:0 0 22px #6edcff;animation:vanish .7s}.boom{left:59%;top:29%;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#fff4a8,#ff713b 35%,transparent 70%);animation:burst .55s}.starfall{left:57%;top:8%;font-size:56px;text-shadow:0 0 18px #9bdcff;animation:fall .75s}.timefx{inset:0;border:5px solid #dcd4ff;box-shadow:inset 0 0 35px #9c8cff;background:#bdb2ff18;animation:vanish .8s}@keyframes vanish{to{opacity:0;transform:scale(1.35) rotate(-18deg)}}@keyframes spin{to{opacity:0;transform:rotate(180deg) scale(1.5)}}@keyframes burst{from{transform:scale(.2)}to{transform:scale(1.5);opacity:0}}@keyframes fall{from{transform:translateY(-70p ty:0;transform:translate(-50%,15px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}.danger{animation:danger .35s}.splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 35%,#43245d,#080713 62%);display:flex;align-items:center;justify-content:center;text-align:center}.splash h1{font-size:42px;letter-spacing:3px;margin:5px;color:#ff75df;text-shadow:0 0 25px #c44dff}.splash p{color:#aaa2c1}.splash .btn{width:230px}.statline{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.statline span{flex:1;background:#211b34;border-radius:10px;padding:8px;font-size:12px;text-align:center}.ready{border-color:#9e72d1!important;box-shadow:0 0 16px #9e72d133}@keyframes danger{50%{box-shadow:inset 0 0 60px #ff315f88}}.owned{background:#263b32;color:#8effb8}.back{width:auto;padding:10px 14px;margin:0 0 12px}.summonflash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090817dd;z-index:30;font-size:72px;animation:reveal .65s ease forwards}.info{position:fixed;left:7%;right:7%;bottom:5%;padding:18px;border-radius:20px;background:#17142af2;border:1px solid #8a62ad;z-index:20}.info h3{margin:0 0 5px}.close{float:right;border:0;border-radius:10px;padding:7px 10px;background:#3a3150;color:#fff}@keyframes reveal{0%{opacity:0;transform:scale(.7)}45%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1)}}
</style></head><body><div id="splash" class="splash"><div><div class="muted">NIGHTFALL PROJECT</div><h1>LUCKY GIRLS</h1><b>LAST WALL</b><p>Random Merge Defense</p><button id="enter" class="btn">TAP TO START</button></div></div>

<script>
const chars=['아리아 ⚔️','유나 🎴','리엘 🔮','루비 🔫','에리카 🐉','세라 😇','레이나 ❄️','카린 🥷','벨 🧸','미아 🗡️','아이린 🫖','네온 💻','샤샤 💣','루나 ✨','비올라 🧪','클로에 🎤','아델 🛡️','니아 😈','오로라 🌠','이브 ⏳'];
let gold=120,life=20,wave=1,luck=0,units=[],kills=0,running=false,timer=null,bossHp=100,bossTick=0,jackpotUntil=0,speed=1,paused=false,summonCount=0;let meta=JSON.parse(localStorage.getItem('lg_meta')||'{"coins":8500,"gems":1200,"owned":[0,1,2,3,4],"daily":0,"accountLv":1,"xp":0,"atkLv":0,"goldLv":0}');meta.accountLv=meta.accountLv||1;meta.xp=meta.xp||0;meta.atkLv=meta.atkLv||0;meta.goldLv=meta.goldLv||0;const looks={아리아:['#ff8acb','#d94a91','⚔'],유나:['#f7f2ff','#a77cff','◇'],리엘:['#d8c2ff','#6d4bdb','✦'],루비:['#ffb06a','#d95050','⌁'],에리카:['#78e4ff','#246e9c','◆'],세라:['#ffe6a8','#d79b42','✧'],레이나:['#b8efff','#468bb5','❄'],카린:['#ff91a6','#822e50','✣'],벨:['#e8c4ff','#7d5695','♟'],미아:['#f2c88f','#7d4d37','†'],아이린:['#d8e4ff','#526b8d','♢'],네온:['#7effe3','#216d74','⌘'],샤샤:['#ff826f','#9b3b38','●'],루나:['#fff0c2','#9b79c5','☾'],비올라:['#b79aff','#563b8d','♜'],클로에:['#ff9fe8','#a04489','♪'],아델:['#d9dce9','#65718a','▣'],니아:['#c78cff','#592d72','▲'],오로라:['#9ad9ff','#4c68ad','✦'],이브:['#e5e0ff','#6e668f','◷']};
const save=()=>localStorage.setItem('lg_meta',JSON.stringify(meta));const role={아리아:'성기사 · 광역 참격',유나:'무녀 · 속박/제어',리엘:'마도사 · 원소 폭발',루비:'총잡이 · 연사/도탄',에리카:'용혈 · 확률 각성',세라:'천사 · 공격력 버프',레이나:'빙결술사 · 동결',카린:'닌자 · 치명타 암살',벨:'인형사 · 추가 소환',미아:'도적 · 추가 골드',아이린:'메이드 · 회복 지원',네온:'해커 · 적 방어 약화',샤샤:'폭파광 · 광역 폭발',루나:'사제 · LUCK 지원',비올라:'마녀 · 중독',클로에:'아이돌 · 공격속도 버프',아델:'기사 · 방어선 보호',니아:'악마 · 고위험 고화력',오로라:'별술사 · 초광역',이브:'시간술사 · 시간 정지'};const $=id=>document.getElementById(id);function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1900)}
function result(win){if(document.querySelector('.result'))return;running=false;if(timer)clearInterval(timer);let reward=win?350:Math.max(40,wave*12),xp=win?120:Math.max(20,wave*5);meta.coins+=reward;meta.xp+=xp;while(meta.xp>=meta.accountLv*100){meta.xp-=meta.accountLv*100;meta.accountLv++;meta.coins+=200}save();metaRender();let x=document.createElement('div');x.className='result';x.innerHTML='<div class="resultbox"><div class="muted">BATTLE RESULT</div><h1>'+(win?'VICTORY':'DEFEAT')+'</h1><p>도달 WAVE '+Math.min(20,wave)+' · '+kills+' KILL</p><div class="reward">🪙 +'+reward+' · XP +'+xp+'</div><button class="btn" id="again">다시 도전</button><button class="btn secondary" id="resultHome">로비</button></div>';document.body.appendChild(x);x.querySelector('#again').onclick=()=>{x.remove();$('start').click()};x.querySelector('#resultHome').onclick=()=>{x.remove();show('home')}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
function metaRender(){$('wallet').textContent=meta.coins.toLocaleString();$('account').innerHTML='<b>COMMANDER LV.'+meta.accountLv+'</b><br><span class="muted">XP '+meta.xp+'/'+(meta.accountLv*100)+' · 영구 공격 +'+(meta.atkLv*3)+'% · 시작 골드 +'+(meta.goldLv*10)+'</span>';$('homeStats').innerHTML='<span>보유<br><b>'+meta.owned.length+'/20</b></span><span>ATK<br><b>+'+(meta.atkLv*3)+'%</b></span><span>START G<br><b>'+ (140+meta.goldLv*10) +'</b></span>';renderShop()}function render(){ $('gold').textContent=gold;$('life').textContent=life;$('wave').textContent=wave;$('killtxt').textContent=kills+' KILL';$('waveprog').style.width=Math.min(100,wave*5)+'%';$('luck').textContent='LUCK '+luck+'%';$('grid').innerHTML='';for(let i=0;i<16;i++){let d=document.createElement('div');d.className='slot';if(units[i]){let u=units[i],v=looks[u.name]||['#ddd','#777',u.icon];d.innerHTML='<div class="chibi"><div class="hair" style="background:'+v[0]+'"></div><div class="head"></div><div class="body" style="background:'+v[1]+'"></div><div class="weapon">'+v[2]+'</div><div class="star">'+('★'.repeat(Math.min(5,u.lv)))+'</div></div>';}else d.innerHTML='';d.dataset.idx=i;if(units[i]&&units.filter(x=>x.name===units[i].name&&x.lv===units[i].lv).length>=3)d.classList.add('ready');d.onclick=()=>{if(units[i])unitInfo(i)};$('grid').appendChild(d)}}
function unitInfo(i){let u=units[i],old=$('unitinfo');if(old)old.remove();let x=document.createElement('div');x.id='unitinfo';x.className='info';x.innerHTML='<button class="close">닫기</button><h3>'+u.icon+' '+u.name+' · '+u.lv+'성</h3><div class="muted">'+(role[u.name]||'가디언')+'</div><p>현재 전투력 '+u.lv+' · 동일 캐릭터/등급 3체 합성 가능</p>';document.body.appendChild(x);x.querySelector('.close').onclick=()=>x.remove()}
function summonFx(u){let x=document.createElement('div');x.className='summonflash';x.textContent=u.icon;document.body.appendChild(x);setTimeout(()=>x.remove(),650)}
function fx(txt){let f=$('field');let x=document.createElement('i');x.className='shot';f.appendChild(x);setTimeout(()=>x.remove(),500);if(txt){let q=document.createElement('b');q.className='skillfx';q.textContent=txt;f.appendChild(q);setTimeout(()=>q.remove(),750);let k='magic';if(/SLASH|암살|참격/.test(txt))k='slash';else if(/빙결|속박/.test(txt))k='ice';else if(/폭발|BURST|각성|BLOOD/.test(txt))k='boom';else if(/STARFALL/.test(txt))k='starfall';else if(/TIME/.test(txt))k='timefx';let v=document.createElement('i');v.className='vfx '+k;v.textContent=k==='starfall'?'✦':'';f.appendChild(v);setTimeout(()=>v.remove(),850)}}
function synergy(){let names=units.map(u=>u.name),tags=[];if(names.includes('아리아')&&names.includes('아델'))tags.push(['🛡 KNIGHT LINK',1.18]);if(names.includes('리엘')&&names.includes('비올라'))tags.push(['✦ ARCANE LINK',1.2]);if(names.includes('루비')&&names.includes('네온'))tags.push(['⌁ TECH LINK',1.2]);if(names.includes('유나')&&names.includes('루나'))tags.push(['☾ BLESS LINK',1.16]);if(names.includes('에리카')&&names.includes('니아'))tags.push(['◆ BLOOD LINK',1.25]);return tags}
function skillPower(){let p=0,n=[],sera=units.some(u=>u.name==='세라'),neon=units.some(u=>u.name==='네온'),chloe=units.some(u=>u.name==='클로에');units.forEach(u=>{let m=1;if(u.name==='아리아')m=1.25;if(u.name==='리엘'&&Math.random()<.28){m=2.2;n.push('🔥 폭발')}if(u.name==='루비')m=1.18;if(u.name==='에리카'&&Math.random()<.08){m=4;n.push('🐉 각성')}if(u.name==='유나'&&Math.random()<.2)n.push('◇ 속박');if(u.name==='세라')m=1.12;if(u.name==='레이나'&&Math.random()<.2)n.push('❄ 빙결');if(u.name==='카린'&&Math.random()<.18){m=2.5;n.push('✣ 암살')}if(u.name==='샤샤')m=1.35;if(u.name==='니아')m=1.55;if(u.name==='오로라'){m=1.45;if(Math.random()<.12)n.push('✦ STARFALL')}if(u.name==='벨'&&Math.random()<.12){m+=.8;n.push('♟ 인형 소환')}if(u.name==='미아'&&Math.random()<.18){gold+=3;n.push('† 약탈 +3G')}if(u.name==='아이린'&&Math.random()<.08){life=Math.min(20,life+1);n.push('♢ 응급 지원')}if(u.name==='루나'&&Math.random()<.15){luck=Math.min(100,luck+4);n.push('☾ 축복')}if(u.name==='비올라'&&Math.random()<.2){m+=.55;n.push('♜ 중독')}if(u.name==='아델'&&Math.random()<.12){life=Math.min(20,life+1);n.push('▣ 수호')}if(u.name==='이브'&&Math.random()<.1)n.push('◷ TIME STOP');if(u.name==='니아'&&Math.random()<.12){m*=2.1;life=Math.max(1,life-1);n.push('▲ BLOOD PACT')}if(sera)m*=1.12;if(neon)m*=1.1;if(chloe)m*=1.08;p+=u.lv*m});let syn=synergy();syn.forEach(x=>p*=x[1]);if(syn.length&&Math.random()<.18)n.push(syn[Math.floor(Math.random()*syn.length)][0]);p*=1+meta.atkLv*.03;if(Date.now()<jackpotUntil)p*=2;return [p,n[0]]}
function bossSkill(){if(wave%5!==0)return;let name={5:'🪨 지진!',10:'🐙 골드 강탈!',15:'👑 재생!',20:'🐲 서리 숨결!'}[wave];if(wave===5)life=Math.max(0,life-1);if(wave===10)gold=Math.max(0,gold-15);if(wave===15)bossHp=Math.min(100,bossHp+12);if(wave===20)luck=Math.max(0,luck-12);fx(name);$('msg').textContent='BOSS SKILL · '+name}
function enemySkin(){let e=$('enemy'),b=$('boss');if(wave%5===0){e.style.display='none';b.style.display='block';b.style.filter='hue-rotate('+((wave/5-1)*55)+'deg)';bossHp=100;$('bosshp').style.width='100%';$('bossbar').style.display='block';return}b.style.display='none';e.style.display='block';$('bossbar').style.display='none';e.style.filter='hue-rotate('+(((wave-1)%3)*65)+'deg)'}
function startLoop(){if(timer)clearInterval(timer);running=true;timer=setInterval(()=>{if(!running||paused)return;let sp=skillPower(),power=sp[0],need=3+Math.floor(wave*.58)+Math.pow(wave,1.18)*.11;if(units.some(u=>u.name==='레이나')&&Math.random()<.12)need*=.75;if(units.some(u=>u.name==='유나')&&Math.random()<.1)need*=.82;bossTick++;if(wave%5===0&&bossTick%2===0)bossSkill();if(power>=need){fx(sp[1]||(['SLASH','ARC','BURST','SHOT','BREAK'][Math.floor(Math.random()*5)]));if(wave%5===0){bossHp=Math.max(0,bossHp-Math.max(6,power*1.8));$('bosshp').style.width=bossHp+'%';if(bossHp>0){$('msg').textContent='⚔️ 보스 공격 · HP '+Math.ceil(bossHp)+'%';render();return}}kills++;gold+=5+wave;luck=Math.min(100,luck+3);$('msg').textContent='⚔️ 적 처치!  '+kills+' KILL';if(kills%6===0){wave++;if(wave>20){running=false;clearInterval(timer);$('msg').textContent='🏆 20 WAVE 클리어!';setTimeout(()=>result(true),500);return}let boss=wave%5===0;bossTick=0;enemySkin();$('msg').textContent=boss?'👹 BOSS WAVE '+wave:'🌙 WAVE '+wave+' 진입';}}else{life--; $('msg').textContent='💥 방어선 피해! 전투력 '+power+'/'+need;if(life<=0){life=0;running=false;clearInterval(timer);$('msg').textContent='☠️ 방어선 붕괴';setTimeout(()=>result(false),500)}else{let b=$('battle');b.classList.remove('danger');void b.offsetWidth;b.classList.add('danger')}}render()},2200/speed)}
$('enter').onclick=()=>{$('splash').style.display='none';metaRender()};$('start').addEventListener('click',()=>{gold=140+(meta.goldLv*10);life=20;wave=1;luck=0;kills=0;units=[];bossHp=100;bossTick=0;jackpotUntil=0;summonCount=0;speed=1;paused=false;$('speed').textContent='×1';$('speed').classList.remove('speedon');$('pause').textContent='Ⅱ';show('battle');enemySkin();render();startLoop()});$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('msg').textContent=paused?'⏸ 일시정지':'▶ 전투 재개'};$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent='×'+speed;$('speed').classList.toggle('speedon',speed===2);if(running)startLoop();};$('back').onclick=()=>{running=false;if(timer)clearInterval(timer);$('boss').style.display='none';$('bossbar').style.display='none';show('home')};$('collection').onclick=()=>{renderCollection();show('col')};$('colback').onclick=()=>show('home');$('shop').onclick=()=>{renderShop();show('store')};$('shopback').onclick=()=>show('home');$('daily').onclick=()=>{let d=new Date().toDateString();if(meta.daily===d){toast('오늘 보상은 이미 받았습니다.');return}meta.daily=d;meta.coins+=500;save();metaRender();toast('출석 보상 +500 코인!')};
$('summon').onclick=()=>{let cost=Math.min(55,30+Math.floor(summonCount/8)*5);if(gold<cost){$('msg').textContent='골드가 부족합니다.';toast('전투 골드가 부족합니다.');return}if(units.length>=16){$('msg').textContent='보드가 가득 찼습니다.';toast('보드가 가득 찼습니다. 합성해 공간을 확보하세요.');return}gold-=cost;summonCount++;let pool=meta.owned;if(!pool.length)pool=[0];let weighted=[];pool.forEach(i=>{let w=i<5?10:i<12?7:4;for(let z=0;z<w;z++)weighted.push(i)});let pick=weighted[Math.floor(Math.random()*weighted.length)],c=chars[pick],p=c.split(' ');let nu={name:p[0],icon:p[1],lv:1};units.push(nu);summonFx(nu);luck=Math.min(100,luck+8);$('msg').textContent=p[0]+' 소환! · 다음 비용 '+Math.min(55,30+Math.floor(summonCount/8)*5)+'G';$('summon').textContent='소환 '+Math.min(55,30+Math.floor(summonCount/8)*5)+'G';render()};
$('merge').onclick=()=>{let found=false;for(let i=0;i<units.length&&!found;i++){let ids=[];for(let j=0;j<units.length;j++)if(units[j].name===units[i].name&&units[j].lv===units[i].lv)ids.push(j);if(ids.length>=3){let base=units[ids[0]],great=Math.random()<.09;base.lv+=great?2:1;units=units.filter((_,k)=>k!==ids[1]&&k!==ids[2]);gold+=10;luck=Math.min(100,luck+15);$('msg').textContent=great?'🌟 GREAT SUCCESS! '+base.name+' '+base.lv+'성':'✨ '+base.name+' '+base.lv+'성 합성 성공!';found=true}}if(!found){$('msg').textContent='같은 유닛 3체가 필요합니다.';toast('합성 가능한 3체가 없습니다.')}render()};
$('luck').onclick=()=>{if(luck<100){$('msg').textContent='LUCK 게이지를 100% 채워주세요.';toast('LUCK '+luck+'% · 아직 사용할 수 없습니다.');return}luck=0;let r=Math.random();if(r<.1){gold+=300;jackpotUntil=Date.now()+10000;$('msg').textContent='🎰 JACKPOT! +300G · 10초 공격력 ×2'}else if(r<.4){gold+=100;$('msg').textContent='✨ LEGEND! +100G'}else if(r<.8){gold+=50;$('msg').textContent='🪙 GOLD! +50G'}else $('msg').textContent='💨 MISS...';render()};
function avatar(n){let v=looks[n]||['#b7a0d8','#59456f','✦'];return '<div class="avatar"><i class="ahr" style="background:'+v[0]+'"></i><i class="ah"></i><i class="ab" style="background:'+v[1]+'"></i><i class="aw">'+v[2]+'</i></div>'}function renderCollection(){$('list').innerHTML=chars.map((c,i)=>{let n=c.split(' ')[0],rar=i<5?'STARTER':i<12?'RARE':'EPIC',own=meta.owned.includes(i);return '<div class="unit">'+avatar(n)+'<b>'+(i+1)+'. '+c+'</b><br><span class="rarity">'+rar+'</span><br><span class="muted">'+(own?(role[n]||'해금 완료'):'🔒 미해금')+'</span></div>'}).join('')}
function renderShop(){if(!$('shoplist'))return;$('shoplist').innerHTML=chars.slice(5).map((c,j)=>{let i=j+5,own=meta.owned.includes(i),price=i<12?3000:4500;return '<div class="shopcard"><div class="portrait">'+avatar(c.split(' ')[0])+'</div><div><b>'+c+'</b><br><span class="muted">'+(i<12?'RARE':'EPIC')+'</span></div><button class="buy '+(own?'owned':'')+'" data-i="'+i+'" data-p="'+price+'">'+(own?'보유중':'🪙 '+price.toLocaleString())+'</button></div>'}).join('');document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,p=+b.dataset.p;if(meta.owned.includes(i))return;if(meta.coins<p){toast('코인이 부족합니다.');return}meta.coins-=p;meta.owned.push(i);save();metaRender();renderCollection();toast(chars[i].split(' ')[0]+' 해금 완료!')});let ac=600+meta.atkLv*350,gc=500+meta.goldLv*300;$('upgrades').innerHTML='<div class="upgrade">전투 훈련 <span class="lvl">LV.'+meta.atkLv+'</span><br><span class="muted">전체 공격력 +3% / Lv</span><button class="buy" id="atkUp">🪙 '+ac+'</button></div><div class="upgrade">보급 훈련 <span class="lvl">LV.'+meta.goldLv+'</span><br><span class="muted">시작 골드 +10 / Lv</span><button class="buy" id="goldUp">🪙 '+gc+'</button></div>';$('atkUp').onclick=()=>buyUp('atkLv',ac);$('goldUp').onclick=()=>buyUp('goldLv',gc)}function buyUp(k,c){if(meta.coins<c){toast('코인이 부족합니다.');return}meta.coins-=c;meta[k]++;save();metaRender();toast('영구 강화 완료 · LV.'+meta[k])}
renderCollection();metaRender();render();
</script></body></html>
